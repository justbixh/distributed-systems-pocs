spring:
  datasource:
    url:      jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Disable Redis auto-configuration during unit tests.
  # Full Spring context tests (RedisPocApplicationTests) override this with
  # @DynamicPropertySource pointing to a test Redis instance.
  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: none    # disable Redis cache in pure unit tests

