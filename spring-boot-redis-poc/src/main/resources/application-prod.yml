server:
  port: ${PORT:8080}

spring:
  datasource:
    hikari:
      minimum-idle:      5
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      lettuce:
        pool:
          max-active: 16
          max-idle:   8
          min-idle:   2

  cache:
    redis:
      time-to-live: 3600000   # 1 hour in prod

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches

logging:
  level:
    com.example.redispoc: INFO
    root: WARN
