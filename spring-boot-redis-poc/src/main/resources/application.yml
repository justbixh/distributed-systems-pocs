server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /api

spring:
  application:
    name: spring-boot-redis-poc
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # ── MySQL ──────────────────────────────────────────────────────────────────
  datasource:
    url:      jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:redispoc}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle:     2
      maximum-pool-size: 10
      idle-timeout:     30000
      pool-name:        HikariPool-redispoc
      max-lifetime:     1800000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ── Redis (cache layer only) ───────────────────────────────────────────────
  data:
    redis:
      host:           ${REDIS_HOST:localhost}
      port:           ${REDIS_PORT:6379}
      password:       ${REDIS_PASSWORD:}
      timeout:        2000ms
      connect-timeout: 2000ms
      client-name:    ${spring.application.name}
      lettuce:
        pool:
          max-active: 8
          max-idle:   4
          min-idle:   1
          max-wait:   2000ms
        shutdown-timeout: 200ms

  cache:
    type: redis
    redis:
      time-to-live:     600000   # 10 minutes default
      cache-null-values: false
      key-prefix:       "redis-poc:"
      use-key-prefix:   true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    caches:
      enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.example.redispoc:          DEBUG
    org.springframework.data.redis: INFO
    org.hibernate.SQL:             DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
