<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebSocket Chat – Spring Boot 4 POC</title>
  <meta name="description" content="Real-time WebSocket chat demo using Spring Boot 4, STOMP, and SockJS" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- SockJS + STOMP clients (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>

  <style>
    /* ───────────────────────────── Design Tokens ───────────────────────────── */
    :root {
      --bg:          #0d1117;
      --surface:     #161b22;
      --surface-2:   #21262d;
      --border:      #30363d;
      --accent:      #7c3aed;
      --accent-2:    #a855f7;
      --accent-glow: rgba(124, 58, 237, 0.35);
      --success:     #22c55e;
      --warning:     #f59e0b;
      --danger:      #ef4444;
      --text:        #e6edf3;
      --text-muted:  #8b949e;
      --font:        'Inter', system-ui, sans-serif;
      --radius:      12px;
      --radius-sm:   8px;
      --transition:  0.2s ease;
    }

    /* ───────────────────────────── Reset ───────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ───────────────────────────── Animated Background ───────────────────────────── */
    .bg-orbs {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.15;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .orb-1 { width: 400px; height: 400px; background: var(--accent); top: -100px; left: -100px; animation-duration: 14s; }
    .orb-2 { width: 300px; height: 300px; background: #06b6d4; bottom: -80px; right: 10%; animation-duration: 10s; animation-delay: -4s; }
    .orb-3 { width: 250px; height: 250px; background: var(--accent-2); top: 40%; right: -80px; animation-duration: 16s; animation-delay: -8s; }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, -30px) scale(1.1); }
    }

    /* ───────────────────────────── Layout ───────────────────────────── */
    .app {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      height: 100vh; max-width: 960px;
      margin: 0 auto; padding: 0 16px;
    }

    /* ───────────────────────────── Header ───────────────────────────── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 0 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
    }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .logo-text { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .logo-badge {
      font-size: 11px; font-weight: 600; padding: 2px 8px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 20px; color: var(--text-muted);
    }

    .status-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 20px;
      background: var(--surface-2); border: 1px solid var(--border);
      font-size: 13px; font-weight: 500;
      transition: var(--transition);
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-muted);
      transition: var(--transition);
    }
    .status-pill.connected .status-dot  { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .status-pill.connected              { border-color: rgba(34,197,94,.3); }
    .status-pill.disconnected .status-dot { background: var(--danger); }

    /* ───────────────────────────── Login panel ───────────────────────────── */
    .login-panel {
      flex: 1; display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 40px;
      width: 100%; max-width: 420px;
      box-shadow: 0 8px 40px rgba(0,0,0,.5);
      animation: slideUp 0.4s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-card h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .login-card p  { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    label { font-size: 13px; font-weight: 500; color: var(--text-muted); }

    input[type=text] {
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text); border-radius: var(--radius-sm);
      padding: 10px 14px; font-size: 15px; font-family: var(--font);
      outline: none; transition: var(--transition);
      width: 100%;
    }
    input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    input[type=text]::placeholder { color: var(--text-muted); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; padding: 10px 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; border: none; border-radius: var(--radius-sm);
      font-size: 14px; font-weight: 600; font-family: var(--font);
      cursor: pointer; transition: var(--transition);
      position: relative; overflow: hidden;
    }
    .btn::after {
      content: ''; position: absolute; inset: 0;
      background: rgba(255,255,255,0);
      transition: var(--transition);
    }
    .btn:hover::after  { background: rgba(255,255,255,.1); }
    .btn:active::after { background: rgba(255,255,255,.2); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-full { width: 100%; }
    .btn-sm   { padding: 8px 14px; font-size: 13px; }
    .btn-ghost {
      background: transparent; border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-ghost:hover { background: var(--surface-2); }
    .btn-danger { background: linear-gradient(135deg, var(--danger), #b91c1c); }

    /* ───────────────────────────── Chat panel ───────────────────────────── */
    .chat-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding-top: 16px; }

    .chat-toolbar {
      display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-shrink: 0;
    }
    .chat-toolbar input { flex: 1; }
    .user-tag {
      padding: 6px 12px; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 20px; font-size: 13px; color: var(--text-muted);
    }
    .user-tag span { color: var(--accent-2); font-weight: 600; }

    /* Tab bar for broadcast / private */
    .tabs {
      display: flex; gap: 4px; margin-bottom: 12px;
      background: var(--surface-2); border-radius: var(--radius-sm);
      padding: 4px; flex-shrink: 0;
    }
    .tab {
      flex: 1; padding: 8px; border-radius: 6px;
      background: transparent; border: none; color: var(--text-muted);
      font-size: 13px; font-weight: 500; cursor: pointer;
      transition: var(--transition); font-family: var(--font);
    }
    .tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.3); }

    /* Message list */
    .messages {
      flex: 1; overflow-y: auto; padding: 12px 0;
      display: flex; flex-direction: column; gap: 10px;
    }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .msg {
      display: flex; flex-direction: column; gap: 2px;
      animation: msgIn 0.2s ease;
      max-width: 85%;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg.own   { align-self: flex-end; }
    .msg.other { align-self: flex-start; }
    .msg.system { align-self: center; max-width: 100%; }

    .msg-bubble {
      padding: 10px 14px; border-radius: var(--radius);
      font-size: 14px; line-height: 1.5;
    }
    .msg.own   .msg-bubble { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-bottom-right-radius: 4px; }
    .msg.other .msg-bubble { background: var(--surface-2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.system .msg-bubble {
      background: transparent; border: 1px solid var(--border);
      color: var(--text-muted); font-size: 12px; padding: 6px 14px;
      border-radius: 20px; text-align: center;
    }
    .msg.private-msg .msg-bubble {
      border: 1px solid rgba(168,85,247,.4);
      background: rgba(124,58,237,.15);
    }

    .msg-meta {
      font-size: 11px; color: var(--text-muted); padding: 0 4px;
      display: flex; gap: 6px; align-items: center;
    }
    .msg.own .msg-meta { justify-content: flex-end; }

    /* Private section */
    .private-section {
      display: none; flex-direction: column; gap: 10px;
      padding: 12px; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      margin-bottom: 12px; flex-shrink: 0;
    }
    .private-section.show { display: flex; }
    .private-section label { font-size: 12px; color: var(--text-muted); }
    .private-row { display: flex; gap: 8px; }
    .private-row input { flex: 1; }

    /* Input bar */
    .input-bar {
      display: flex; gap: 10px; align-items: flex-end;
      padding: 14px 0; border-top: 1px solid var(--border); flex-shrink: 0;
    }
    .input-bar input { flex: 1; }

    /* Typing indicator */
    .typing-indicator {
      font-size: 12px; color: var(--text-muted);
      padding: 4px 0; min-height: 20px; flex-shrink: 0;
    }
    .typing-dots { display: inline-flex; gap: 3px; }
    .typing-dots span {
      width: 4px; height: 4px; border-radius: 50%;
      background: var(--text-muted); display: inline-block;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-4px); }
    }

    /* Toast */
    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      padding: 12px 18px; border-radius: var(--radius-sm);
      background: var(--surface); border: 1px solid var(--border);
      font-size: 13px; font-weight: 500;
      animation: toastIn 0.3s ease; box-shadow: 0 4px 20px rgba(0,0,0,.4);
      max-width: 300px;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .toast.success { border-color: rgba(34,197,94,.4); color: var(--success); }
    .toast.error   { border-color: rgba(239,68,68,.4); color: var(--danger); }
    .toast.info    { border-color: rgba(124,58,237,.4); color: var(--accent-2); }

    /* Responsive */
    @media (max-width: 600px) {
      .logo-badge { display: none; }
      .user-tag   { display: none; }
    }
  </style>
</head>
<body>

<!-- Animated background orbs -->
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="app">
  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-icon">💬</div>
      <span class="logo-text">WS Chat</span>
      <span class="logo-badge">Spring Boot 4 · STOMP</span>
    </div>
    <div id="statusPill" class="status-pill disconnected">
      <span class="status-dot"></span>
      <span id="statusText">Disconnected</span>
    </div>
  </header>

  <!-- Login panel -->
  <div class="login-panel" id="loginPanel">
    <div class="login-card">
      <h2>Join the Chat</h2>
      <p>Enter your name to connect via WebSocket + STOMP</p>

      <div class="field">
        <label for="usernameInput">Your display name</label>
        <input id="usernameInput" type="text" placeholder="e.g. Alice" maxlength="24"
               autocomplete="off" />
      </div>

      <button id="connectBtn" class="btn btn-full" onclick="connect()">
        ⚡ Connect
      </button>
    </div>
  </div>

  <!-- Chat panel (hidden until connected) -->
  <div class="chat-panel" id="chatPanel" style="display:none">

    <div class="chat-toolbar">
      <div class="user-tag">Signed in as <span id="myNameLabel">?</span></div>
      <button class="btn btn-sm btn-ghost" onclick="disconnect()">Disconnect</button>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button id="tabBroadcast" class="tab active" onclick="switchTab('broadcast')">
        📢 Broadcast
      </button>
      <button id="tabPrivate" class="tab" onclick="switchTab('private')">
        🔒 Private DM
      </button>
    </div>

    <!-- Private DM target -->
    <div class="private-section" id="privateSection">
      <label>Send a direct message to:</label>
      <div class="private-row">
        <input id="recipientInput" type="text" placeholder="Recipient username" />
      </div>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages" aria-live="polite" aria-label="Chat messages"></div>

    <!-- Typing indicator -->
    <div class="typing-indicator" id="typingIndicator"></div>

    <!-- Input bar -->
    <div class="input-bar">
      <input id="messageInput" type="text" placeholder="Type a message…"
             maxlength="500" onkeydown="handleKey(event)" autocomplete="off" />
      <button id="sendBtn" class="btn" onclick="sendMessage()">Send →</button>
    </div>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<script>
  /* ─────────────────────────────────────────────────────────────────────────
     State
  ───────────────────────────────────────────────────────────────────────── */
  let stompClient = null;
  let myName = '';
  let currentTab = 'broadcast';
  let typingTimer = null;

  /* ─────────────────────────────────────────────────────────────────────────
     Connection
  ───────────────────────────────────────────────────────────────────────── */
  function connect() {
    const input = document.getElementById('usernameInput');
    myName = input.value.trim();
    if (!myName) { showToast('Please enter your name', 'error'); return; }

    document.getElementById('connectBtn').disabled = true;
    document.getElementById('connectBtn').textContent = 'Connecting…';

    const socket = new SockJS('/ws');
    stompClient = new StompJs.Client({
      webSocketFactory: () => socket,
      reconnectDelay: 5000,

      onConnect: () => {
        // Subscribe to broadcast channel
        stompClient.subscribe('/topic/messages', onBroadcastMessage);
        // Subscribe to private queue (user-specific)
        stompClient.subscribe('/user/queue/private', onPrivateMessage);

        // Announce join
        stompClient.publish({
          destination: '/app/chat.join',
          body: JSON.stringify({ from: myName, type: 'JOIN' })
        });

        setConnectedUI(true);
        showToast('Connected! 🎉', 'success');
      },

      onDisconnect: () => {
        setConnectedUI(false);
        showToast('Disconnected from server', 'error');
      },

      onStompError: (frame) => {
        console.error('STOMP error', frame);
        showToast('Connection error: ' + frame.headers?.message, 'error');
        document.getElementById('connectBtn').disabled = false;
        document.getElementById('connectBtn').textContent = '⚡ Connect';
      }
    });

    stompClient.activate();
  }

  function disconnect() {
    if (stompClient) {
      stompClient.deactivate();
      stompClient = null;
    }
    setConnectedUI(false);
  }

  /* ─────────────────────────────────────────────────────────────────────────
     Message handling
  ───────────────────────────────────────────────────────────────────────── */
  function onBroadcastMessage(frame) {
    const msg = JSON.parse(frame.body);
    renderMessage(msg, false);
  }

  function onPrivateMessage(frame) {
    const msg = JSON.parse(frame.body);
    renderMessage(msg, true);
    if (currentTab !== 'private') {
      showToast('💬 New private message from ' + msg.from, 'info');
    }
  }

  function renderMessage(msg, isPrivate) {
    const list = document.getElementById('messages');

    const isSystem = msg.type === 'JOIN' || msg.type === 'LEAVE';
    const isOwn    = msg.from === myName && !isSystem;

    const div = document.createElement('div');
    div.className = [
      'msg',
      isSystem ? 'system' : (isOwn ? 'own' : 'other'),
      isPrivate ? 'private-msg' : ''
    ].join(' ').trim();

    const time = msg.timestamp
      ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    if (isSystem) {
      div.innerHTML = `<div class="msg-bubble">${escHtml(msg.content)}</div>`;
    } else {
      div.innerHTML = `
        <div class="msg-meta">
          ${!isOwn ? `<strong>${escHtml(msg.from)}</strong>` : ''}
          ${isPrivate ? '🔒' : ''}
          <span>${time}</span>
        </div>
        <div class="msg-bubble">${escHtml(msg.content)}</div>
      `;
    }

    list.appendChild(div);
    list.scrollTop = list.scrollHeight;
  }

  function sendMessage() {
    const input   = document.getElementById('messageInput');
    const content = input.value.trim();
    if (!content || !stompClient?.connected) return;

    if (currentTab === 'broadcast') {
      stompClient.publish({
        destination: '/app/chat.send',
        body: JSON.stringify({ from: myName, content, type: 'CHAT' })
      });
    } else {
      const recipient = document.getElementById('recipientInput').value.trim();
      if (!recipient) { showToast('Enter a recipient username', 'error'); return; }
      stompClient.publish({
        destination: '/app/chat.private',
        body: JSON.stringify({ from: myName, to: recipient, content, type: 'PRIVATE' })
      });
    }

    input.value = '';
  }

  /* ─────────────────────────────────────────────────────────────────────────
     UI helpers
  ───────────────────────────────────────────────────────────────────────── */
  function setConnectedUI(connected) {
    const pill   = document.getElementById('statusPill');
    const status = document.getElementById('statusText');
    pill.className   = 'status-pill ' + (connected ? 'connected' : 'disconnected');
    status.textContent = connected ? 'Connected' : 'Disconnected';

    document.getElementById('loginPanel').style.display = connected ? 'none' : 'flex';
    document.getElementById('chatPanel').style.display  = connected ? 'flex' : 'none';

    if (connected) {
      document.getElementById('myNameLabel').textContent = myName;
      document.getElementById('messageInput').focus();
    } else {
      document.getElementById('connectBtn').disabled = false;
      document.getElementById('connectBtn').textContent = '⚡ Connect';
      document.getElementById('messages').innerHTML = '';
    }
  }

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tabBroadcast').classList.toggle('active', tab === 'broadcast');
    document.getElementById('tabPrivate').classList.toggle('active', tab === 'private');
    document.getElementById('privateSection').classList.toggle('show', tab === 'private');
  }

  function handleKey(e) {
    if (e.key === 'Enter') { sendMessage(); return; }

    // Simulate typing indicator (cosmetic, not broadcast to others)
    clearTimeout(typingTimer);
    const ti = document.getElementById('typingIndicator');
    ti.innerHTML = `You are typing <span class="typing-dots"><span></span><span></span><span></span></span>`;
    typingTimer = setTimeout(() => { ti.innerHTML = ''; }, 1500);
  }

  function escHtml(str) {
    return String(str ?? '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function showToast(msg, type = 'info') {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }

  // Press Enter in login input
  document.getElementById('usernameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') connect();
  });
</script>
</body>
</html>
